name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build --production
      # the fixture workspace runs the published core (npm, not part of this pnpm workspace)
      - run: npm install --no-package-lock --no-audit --no-fund
        working-directory: test/fixtures/workspace
      # VS Code itself is downloaded by @vscode/test-electron and needs a display
      - run: xvfb-run -a pnpm test:integration
      - run: pnpm exec vsce package --no-dependencies
