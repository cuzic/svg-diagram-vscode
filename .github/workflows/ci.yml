name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build --production
      # the fixture workspace runs core v0.9.0 from its GitHub release tarball (not part of this pnpm workspace)
      - run: npm install --no-package-lock --no-audit --no-fund
        working-directory: test/fixtures/workspace
      # VS Code itself is downloaded by @vscode/test-electron and needs a display
      - run: xvfb-run -a pnpm test:integration
      - run: pnpm exec vsce package --no-dependencies

  # The extension in a real VS Code window, clicked through with Playwright (e2e/). Screenshots of every step, a
  # Playwright trace (npx playwright show-trace trace.zip) and the HTML report are uploaded as the artifact
  # "e2e-<os>-<version>" (also when the run passes). The trace is in the first test's folder, trace/trace.zip.
  # A retry is allowed, but a test that only passes on retry fails the job (--fail-on-flaky-tests). E2E_TRACE=1 adds VS Code's verbose log to the job log.
  e2e:
    name: e2e (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        vscode: ['1.100.0', stable] # the engines minimum, and the latest
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --no-package-lock --no-audit --no-fund
        working-directory: test/fixtures/workspace
      # "stable" is resolved to its version number, so the cache key changes only when a new VS Code is released
      # (one entry per OS and version, no growth per run)
      - name: Resolve the VS Code version
        shell: bash # -o pipefail: a failed curl must fail the step, not leave an empty version
        run: |
          v='${{ matrix.vscode }}'
          if [ "$v" = stable ]; then v=$(curl -fsSL https://update.code.visualstudio.com/api/releases/stable | jq -r '.[0]'); fi
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::could not resolve the VS Code version (got '$v')"; exit 1; }
          echo "VSCODE_VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-${{ env.VSCODE_VERSION }}
      - name: e2e (Linux, on a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" pnpm test:e2e --fail-on-flaky-tests
      - name: e2e (macOS)
        if: runner.os == 'macOS'
        run: pnpm test:e2e --fail-on-flaky-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.os }}-${{ matrix.vscode }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
